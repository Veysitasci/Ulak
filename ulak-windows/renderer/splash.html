<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULAK Başlatılıyor</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/glass.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0d14;
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      -webkit-app-region: drag;
    }
    .splash-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0d14;
      padding: 24px 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }
    .splash-card {
      width: 100%;
      max-width: 290px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: splashFadeIn 0.35s ease;
    }
    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .splash-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.45));
    }
    .splash-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 3.5px;
      color: #ffffff;
      line-height: 1.1;
    }
    .splash-subtitle {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent, #10b981);
      margin-top: 3px;
    }
    .splash-separator {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      margin: 16px 0 14px 0;
    }
    .splash-step {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-2, #9aa3b2);
      min-height: 22px;
    }
    .splash-step.active {
      display: flex;
      animation: stepIn 0.22s ease;
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .splash-dot {
      width: 16px;
      height: 16px;
      font-size: 9px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent, #10b981);
      color: #ffffff;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
      flex-shrink: 0;
      font-weight: 700;
    }
    .splash-progressbar {
      width: 100%;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--r-full, 9999px);
      margin-top: 14px;
      overflow: hidden;
    }
    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent, #10b981), #34d399);
      box-shadow: 0 0 10px var(--accent, #10b981);
      transition: width 0.35s ease;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-card">
      <img src="../assets/ulak_logo.png" class="splash-logo" alt="ULAK">
      <div class="splash-title">ULAK</div>
      <div class="splash-subtitle">Ağ ve Güvenlik İstasyonu</div>
      <div class="splash-separator"></div>
      
      <div class="splash-step active" id="step-1">
        <span class="splash-dot">1</span>
        <span>Donanım ve Bellek Doğrulaması...</span>
      </div>
      <div class="splash-step" id="step-2">
        <span class="splash-dot">2</span>
        <span>Windows Güvenlik Duvarı & Ağ Analizi...</span>
      </div>
      <div class="splash-step" id="step-3">
        <span class="splash-dot">3</span>
        <span>Güvenlik ve Modül Motoru Başlatılıyor...</span>
      </div>

      <div class="splash-progressbar">
        <div class="splash-progress-fill" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    async function runSplash() {
      const bar = document.getElementById('progress-bar');
      const step1 = document.getElementById('step-1');
      const step2 = document.getElementById('step-2');
      const step3 = document.getElementById('step-3');

      // Step 1: Donanım ve Bellek
      if (bar) bar.style.width = '35%';
      await new Promise(r => setTimeout(r, 450));

      // Step 2: Güvenlik Duvarı & Ağ
      if (step1) step1.classList.remove('active');
      if (step2) step2.classList.add('active');
      if (bar) bar.style.width = '70%';
      await new Promise(r => setTimeout(r, 450));

      // Step 3: Modül Motoru
      if (step2) step2.classList.remove('active');
      if (step3) step3.classList.add('active');
      if (bar) bar.style.width = '100%';
      await new Promise(r => setTimeout(r, 400));

      // Notify main process to close splash & show main window
      if (window.ulak && window.ulak.invoke) {
        try {
          await window.ulak.invoke('app:splash-complete');
        } catch (e) {
          console.error(e);
        }
      }
    }
    document.addEventListener('DOMContentLoaded', runSplash);
  </script>
</body>
</html>
