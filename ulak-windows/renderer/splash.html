<!DOCTYPE html>
<html lang="tr" data-theme="nord-dark" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULAK Başlatılıyor</title>

  <!-- Pre-render theme resolver: prevents any theme flash or mismatch -->
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const qTheme = params.get('theme');
        const qMode = params.get('mode');
        const qFamily = params.get('family');

        let family = localStorage.getItem('ulak-theme-family') || qFamily || 'nord';
        let mode = localStorage.getItem('ulak-theme-mode') || qMode;
        let themeId = localStorage.getItem('ulak-theme') || qTheme;

        // Fallback for mode: check theme name or OS dark/light scheme
        if (!mode) {
          if (themeId && themeId.includes('light')) {
            mode = 'light';
          } else if (themeId && themeId.includes('dark')) {
            mode = 'dark';
          } else {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            mode = prefersDark ? 'dark' : 'light';
          }
        }

        // Fallback for themeId
        if (!themeId) {
          themeId = (family === 'ulak') ? mode : `${family}-${mode}`;
        }

        document.documentElement.setAttribute('data-theme', themeId);
        document.documentElement.setAttribute('data-mode', mode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'nord-dark');
        document.documentElement.setAttribute('data-mode', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/glass.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    :root {
      --splash-shadow: 0 20px 48px rgba(0, 0, 0, 0.52), 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    :root[data-mode="light"],
    :root[data-theme*="light"] {
      --splash-shadow: 0 20px 48px rgba(15, 23, 42, 0.16), 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--font-family, 'Segoe UI Variable Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
    }

    .splash-container {
      width: 468px;
      height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--app-bg-gradient, var(--app-bg));
      padding: 22px 30px;
      border: 1px solid var(--glass-border-light);
      border-radius: 16px;
      position: relative;
      box-shadow: var(--splash-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      overflow: hidden;
    }

    /* Ambient theme glow at top */
    .splash-container::before {
      content: '';
      position: absolute;
      top: -35%;
      left: 15%;
      right: 15%;
      height: 65%;
      background: radial-gradient(ellipse at center, var(--accent-glow, rgba(16, 185, 129, 0.25)) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.75;
      filter: blur(20px);
    }

    .splash-container.fade-out {
      opacity: 0;
      transform: scale(0.97);
    }

    .splash-card {
      width: 100%;
      max-width: 390px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      animation: splashFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes splashFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .logo-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow, rgba(16, 185, 129, 0.4)) 0%, transparent 70%);
      filter: blur(8px);
      animation: pulseGlow 2.2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { opacity: 0.45; transform: scale(0.92); }
      to { opacity: 0.95; transform: scale(1.08); }
    }

    .splash-logo {
      position: relative;
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px var(--accent-glow, rgba(16, 185, 129, 0.45)));
    }

    .splash-title-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .splash-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--text-1);
      line-height: 1.1;
    }

    .splash-theme-pill {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2.5px 8px;
      border-radius: 9999px;
      background: var(--accent-soft, rgba(16, 185, 129, 0.12));
      color: var(--accent);
      border: 1px solid var(--accent-border, rgba(16, 185, 129, 0.25));
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: capitalize;
    }

    .splash-theme-pill-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow, var(--accent));
    }

    .splash-subtitle {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 4px;
    }

    .splash-separator {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border-light), transparent);
      margin: 14px 0 12px 0;
    }

    /* Live Background Status Card */
    .status-panel {
      width: 100%;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
      border-radius: 9px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-step-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-1);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow, var(--accent));
      display: inline-block;
      animation: blinkDot 1s infinite alternate;
    }

    @keyframes blinkDot {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .status-percent {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .status-subtext {
      font-size: 10.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 15px;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace);
    }

    /* Theme-adaptive Progress bar */
    .splash-progressbar {
      width: 100%;
      height: 3.5px;
      background: var(--glass-border-light);
      border-radius: 9999px;
      margin-top: 12px;
      overflow: hidden;
      position: relative;
    }

    .splash-progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong, var(--accent)), var(--accent));
      background-size: 200% 100%;
      box-shadow: 0 0 10px var(--accent-glow, var(--accent));
      border-radius: 9999px;
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      animation: shimmerBar 1.5s linear infinite;
    }

    @keyframes shimmerBar {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splash-container">
    <div class="splash-card">
      <div class="logo-wrap">
        <div class="logo-glow"></div>
        <img src="../assets/ulak_logo.png" class="splash-logo" id="splash-logo" alt="ULAK">
      </div>
      <div class="splash-title-row">
        <div class="splash-title">ULAK</div>
        <div class="splash-theme-pill" id="splash-theme-pill" title="Aktif ULAK Teması">
          <span class="splash-theme-pill-dot"></span>
          <span id="splash-theme-text">Nord • Koyu</span>
        </div>
      </div>
      <div class="splash-subtitle">Ağ & Sistem Güvenlik İstasyonu</div>
      <div class="splash-separator"></div>

      <!-- Live background task status indicator -->
      <div class="status-panel">
        <div class="status-header">
          <div class="status-step-title">
            <span class="pulse-dot"></span>
            <span id="step-title">Donanım & Çekirdek Sistem</span>
          </div>
          <span class="status-percent" id="step-percent">15%</span>
        </div>
        <div class="status-subtext" id="step-subtext">CPU ve bellek telemetrisi başlatılıyor...</div>
      </div>

      <div class="splash-progressbar">
        <div class="splash-progress-fill" id="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Theme names map
    const THEME_NAMES = {
      nord: 'Nord',
      dracula: 'Dracula',
      catppuccin: 'Catppuccin',
      gruvbox: 'Gruvbox',
      rosePine: 'Rosé Pine',
      ulak: 'Obsidian'
    };

    function applyResolvedTheme() {
      const params = new URLSearchParams(window.location.search);
      const qTheme = params.get('theme');
      const qMode = params.get('mode');
      const qFamily = params.get('family');

      let family = localStorage.getItem('ulak-theme-family') || qFamily || 'nord';
      let mode = localStorage.getItem('ulak-theme-mode') || qMode;
      let themeId = localStorage.getItem('ulak-theme') || qTheme;

      if (!mode) {
        if (themeId && themeId.includes('light')) {
          mode = 'light';
        } else if (themeId && themeId.includes('dark')) {
          mode = 'dark';
        } else {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          mode = prefersDark ? 'dark' : 'light';
        }
      }

      if (!themeId) {
        themeId = (family === 'ulak') ? mode : `${family}-${mode}`;
      }

      document.documentElement.setAttribute('data-theme', themeId);
      document.documentElement.setAttribute('data-mode', mode);

      const isLight = mode === 'light' || themeId.includes('light');

      // Adjust logo for theme contrast
      const logoEl = document.getElementById('splash-logo');
      if (logoEl) {
        logoEl.src = isLight ? '../assets/ulak_logo_dark.png' : '../assets/ulak_logo.png';
      }

      // Update theme badge text
      const themeTextEl = document.getElementById('splash-theme-text');
      if (themeTextEl) {
        let displayName = THEME_NAMES[family] || family;
        if (family === 'ulak') {
          displayName = isLight ? 'Frosted' : 'Obsidian';
        }
        themeTextEl.textContent = `${displayName} • ${isLight ? 'Açık' : 'Koyu'}`;
      }
    }

    applyResolvedTheme();

    const steps = [
      {
        percent: 25,
        title: 'Donanım & Çekirdek Sistem',
        subtext: '[OK] CPU sensörleri & RAM havuzu hazırlandı.'
      },
      {
        percent: 50,
        title: 'Güvenlik Duvarı & Ağ Analizi',
        subtext: '[OK] Windows Güvenlik Duvarı & adaptörler aktif.'
      },
      {
        percent: 75,
        title: 'Medya & İndirme Motoru',
        subtext: '[OK] yt-dlp v2026.10.26 & FFmpeg 6.1 hazır.'
      },
      {
        percent: 92,
        title: 'Modül Sistemi & Güvenlik Kasası',
        subtext: '[OK] Kasa, temizleyici ve modül kayıtları yüklendi.'
      },
      {
        percent: 100,
        title: 'Sistem Hazır',
        subtext: '[OK] ULAK masaüstü ortamı açılıyor...'
      }
    ];

    async function runSplash() {
      const container = document.getElementById('splash-container');
      const bar = document.getElementById('progress-bar');
      const titleEl = document.getElementById('step-title');
      const percentEl = document.getElementById('step-percent');
      const subtextEl = document.getElementById('step-subtext');

      for (let i = 0; i < steps.length; i++) {
        const s = steps[i];
        if (bar) bar.style.width = s.percent + '%';
        if (percentEl) percentEl.textContent = s.percent + '%';
        if (titleEl) titleEl.textContent = s.title;
        if (subtextEl) subtextEl.textContent = s.subtext;

        // Snappy transition per step (~220ms, last step 150ms)
        const delay = (i === steps.length - 1) ? 150 : 220;
        await new Promise(r => setTimeout(r, delay));
      }

      // Smooth fade-out before opening main window
      if (container) container.classList.add('fade-out');
      await new Promise(r => setTimeout(r, 120));

      // Notify main process to close splash & bring up main window
      if (window.ulak && window.ulak.invoke) {
        try {
          await window.ulak.invoke('app:splash-complete');
        } catch (e) {
          console.error(e);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', runSplash);
  </script>
</body>
</html>
